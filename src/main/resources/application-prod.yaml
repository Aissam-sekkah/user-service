# Production Configuration
# ⚠️ All secrets MUST be provided via environment variables

server:
  port: 8080
  forward-headers-strategy: framework  # Enable X-Forwarded-* headers for HTTPS behind proxy

spring:
  application:
    name: user-service
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/userdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

# Security Configuration
application:
  security:
    jwt:
      # ⚠️ REQUIRED: Must be set in production (min 32 characters)
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:3600000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Initial admin bootstrap — creates a ROLE_ADMIN account on first start if it
# does not already exist. Leave unset to disable. Password must satisfy the
# complexity policy (>=8 chars, letter+digit+special).
app:
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# CORS Configuration - Restrict to your frontend domains
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# LOGGING - Production levels (no DEBUG)
logging:
  level:
    root: WARN
    com.aissek.userservice: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ACTUATOR - Secure in production
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  security:
    enabled: true
