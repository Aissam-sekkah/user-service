server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: user-service

# BASE DE DONNEES
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:secret}

# JPA Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  springdoc:
    packages-to-scan: com.aissek.userservice.adapter.in.web
    swagger-ui:
      path: /swagger-ui
    api-docs:
      path: /v3/api-docs
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  sql:
    init:
      mode: never

# LOGGING
logging:
  level:
    root: info
    com.aissek.userservice: INFO
    org.hibernate.sql: WARN
    org.hibernate.type.descriptor.sql: WARN

# ACTUATOR & MONITORING
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info,metrics"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Security Configuration
application:
  security:
    jwt:
      # ⚠️ CRITICAL: MUST be set as environment variable in production
      # Never commit secrets to version control
      secret: ${JWT_SECRET:REMOVED_LEAKED_SECRET}
      expiration: ${JWT_EXPIRATION:3600000}             # 1 hour (access token)
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days (refresh token)
