spring.application.name=user-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security - Using environment variables for production safety
application.security.jwt.secret=${APPLICATION_SECURITY_JWT_SECRET:default_secret_key_for_dev_only_32_chars_min}
application.security.jwt.expiration=${APPLICATION_SECURITY_JWT_EXPIRATION:3600000}
application.security.jwt.refresh-expiration=${APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION:604800000}

# Management
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Swagger
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
