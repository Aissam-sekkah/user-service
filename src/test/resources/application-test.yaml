spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Security Configuration for tests
application:
  security:
    jwt:
      secret: TestSecretKeyForUnitTestsMustBeAtLeast32CharactersLong
      expiration: 3600000
      refresh-expiration: 604800000

# Logging for tests
logging:
  level:
    root: WARN
    com.aissek.userservice: DEBUG
