# Local guardrails that run BEFORE a commit leaves the machine.
# Install once:  pipx install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  # Stop secrets from ever being committed (defense-in-depth with the CI scan).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Cheap hygiene checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
