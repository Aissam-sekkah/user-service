name: Security

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly — catches newly-disclosed CVEs against unchanged code

jobs:
  # --- Secret scanning -------------------------------------------------------
  # Highest priority for this repo: a JWT secret / DB password was committed in
  # the past. fetch-depth: 0 scans the full history, not just the latest diff.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- SAST (static analysis of our own source) -----------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v3
        with:
          language: java-kotlin
      - name: Compile (CodeQL traces the build)
        run: ./gradlew compileJava --no-daemon
      - uses: github/codeql-action/analyze@v3

  # --- SCA (block PRs that introduce vulnerable dependencies) ----------------
  # Requires the repo's Dependency Graph to be enabled
  # (Settings -> Code security and analysis -> Dependency graph -> Enable).
  # continue-on-error keeps the pipeline green until that one-time setting is on;
  # once enabled, remove it so the job can actually block bad PRs.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
