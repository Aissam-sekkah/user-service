name: Security

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly — catches newly-disclosed CVEs against unchanged code

jobs:
  # --- Secret scanning -------------------------------------------------------
  # Highest priority for this repo: a JWT secret / DB password was committed in
  # the past. fetch-depth: 0 scans the full history, not just the latest diff.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- SAST (static analysis of our own source) -----------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v3
        with:
          language: java-kotlin
      - name: Compile (CodeQL traces the build)
        run: ./gradlew compileJava --no-daemon
      - uses: github/codeql-action/analyze@v3

  # --- SCA (block PRs that introduce vulnerable dependencies) ----------------
  # Requires the repo's Dependency Graph to be enabled
  # (Settings -> Code security and analysis -> Dependency graph -> Enable).
  # continue-on-error keeps the pipeline green until that one-time setting is on;
  # once enabled, remove it so the job can actually block bad PRs.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # --- SBOM (CycloneDX inventory of everything we ship) ----------------------
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/bom.json

  # --- Container image scan (OS + library CVEs in the runtime image) --------
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t user-service:scan .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: user-service:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'   # report-only for now; raise to '1' to fail on findings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy.sarif
      - name: Upload to code scanning
        if: always()
        continue-on-error: true   # needs GitHub Advanced Security on private repos
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
